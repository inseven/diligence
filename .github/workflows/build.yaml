name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 14 * * 1'  # 04:00 Monday, HST.
  workflow_dispatch:

jobs:
  test:

    name: build
    runs-on: inseven-macos-26

    env:

      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v5.0.1
      with:
        version: 2026.9.10
        cache: false

    - name: Build and test
      run: exec ./scripts/build.sh

    - name: Release
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: scripts/release.sh
